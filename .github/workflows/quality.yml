name: Quality Gate
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate structured records and upstream mirror
        run: python scripts/validate_data.py
      - name: Build site
        run: python scripts/build_site.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify generated website
        run: |
          test -f _site/index.html
          test -f _site/topics/jobs/index.html
          test -f _site/topics/housing/index.html
          test -f _site/topics/benefits/index.html
          test -f _site/topics/education/index.html
          test -f _site/topics/economy/index.html
          test -f _site/topics/mobility/index.html
          test -f _site/topics/lifestyle/index.html
          test -f _site/assets/site.css

  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser QA dependencies
        run: |
          python -m pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Validate all published Olah reports
        run: |
          set -euo pipefail
          for page in content/reports/*/index.html; do
            echo "Validating $page"
            python .pi/skills/olah-style-paper-posts/scripts/validate.py "$page"
          done
      - name: Chromium viewport and interaction checks for every report
        run: |
          set -euo pipefail
          for page in content/reports/*/index.html; do
            slug="$(basename "$(dirname "$page")")"
            echo "Browser QA: $slug"
            python .pi/skills/olah-style-paper-posts/scripts/browser_check.py "$page" --output "qa-reports/$slug"
          done
      - name: Save browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-all-reports-browser-qa
          path: qa-reports/
          if-no-files-found: ignore
